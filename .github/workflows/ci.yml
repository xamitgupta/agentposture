name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=agentposture --cov-report=term-missing
      - name: Smoke test the CLI end to end
        run: |
          agentposture demo --out /tmp/sample
          test -s /tmp/sample/index.html
          agentposture check examples/manifests --fail-on critical
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentposture:ci .
      - run: docker run --rm agentposture:ci --version
