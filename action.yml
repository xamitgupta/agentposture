name: AgentPosture risk gate
description: Score the agent.yaml manifests in a repository and fail when any agent reaches a risk tier.
branding: {icon: shield, color: red}
inputs:
  paths:
    description: Files or directories to check.
    default: "."
  fail-on:
    description: Fail at this tier or above (low, medium, high, critical).
    default: critical
  policy:
    description: Path to a custom policy file. Defaults to the built-in policy.
    default: default
  version:
    description: AgentPosture version to install (a git ref of this repository).
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with: {python-version: "3.12"}
    - shell: bash
      run: pip install --quiet "agentposture @ git+https://github.com/${{ github.action_repository || 'xamitgupta/agentposture' }}@${{ inputs.version || github.action_ref || 'main' }}"
    - shell: bash
      run: agentposture check ${{ inputs.paths }} --fail-on "${{ inputs.fail-on }}" --policy "${{ inputs.policy }}"
