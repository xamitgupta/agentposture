[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "agentposture"
version = "1.0.0"
description = "Find every AI agent in your organization and know how risky each one is."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Amit Gupta" }]
keywords = ["ai-agents", "ai-governance", "risk-assessment", "security", "grc", "inventory",
            "nist-ai-rmf", "owasp-llm", "mcp", "shadow-ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[project.scripts]
agentposture = "agentposture.cli:main"

[project.urls]
Homepage = "https://github.com/xamitgupta/agentposture"
Documentation = "https://github.com/xamitgupta/agentposture/tree/main/docs"
Issues = "https://github.com/xamitgupta/agentposture/issues"
Changelog = "https://github.com/xamitgupta/agentposture/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/agentposture"]

[tool.hatch.build.targets.sdist]
include = ["src/agentposture", "tests", "docs", "examples", "schemas", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S104", "S603", "S607", "B008", "UP007", "E501", "S310"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.coverage.run]
source = ["agentposture"]
omit = ["src/agentposture/connectors/aws_bedrock.py", "src/agentposture/connectors/entra_id.py"]
